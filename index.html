<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Lyric Solitaire — Build the lyrics. Play the song."
    >

    <title>Lyric Solitaire — Coming Soon</title>

    <style>

        /*
         * ==========================================================
         * LYRIC SOLITAIRE — HOMEPAGE
         * ==========================================================
         *
         * This is the public landing page for Lyric Solitaire.
         *
         * The actual game is located in:
         *
         *     game.html
         *
         * This page intentionally does not load the game JavaScript.
         *
         * ==========================================================
         */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #111c27;
            font-family: Arial, Helvetica, sans-serif;
        }


        /*
         * ----------------------------------------------------------
         * PAGE CONTAINER
         * ----------------------------------------------------------
         */

        .landing-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /*
         * ----------------------------------------------------------
         * PROMOTIONAL IMAGE
         * ----------------------------------------------------------
         *
         * The image contains the complete temporary promotional
         * artwork, including:
         *
         *     Lyric Solitaire
         *     Coming Soon
         *     Song-word examples
         *     Sing the Words You Love
         *     Developer credit
         *     ThroatPhlegm
         *     King's Mark Games
         *
         * ----------------------------------------------------------
         */

        .cover-art {
            display: block;

            width: 100%;
            max-width: 900px;
            height: auto;

            border-radius: 8px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }


        /*
         * ----------------------------------------------------------
         * PLAY BUTTON
         * ----------------------------------------------------------
         *
         * The game is not ready yet, but we'll eventually use this
         * button to send the player to game.html.
         *
         * For now it is hidden.
         *
         * ----------------------------------------------------------
         */

        .play-button {
            display: none;

            margin-top: 20px;

            padding: 14px 28px;

            background: #c99b3b;
            color: #111c27;

            border: none;
            border-radius: 8px;

            font-size: 20px;
            font-weight: bold;

            text-decoration: none;
        }


        /*
         * ----------------------------------------------------------
         * MOBILE
         * ----------------------------------------------------------
         */

        @media (max-width: 600px) {

            .landing-page {
                padding: 8px;
            }

            .cover-art {
                border-radius: 4px;
            }

        }

    </style>

</head>


<body>

    <main class="landing-page">

        <div>

            <img
                class="cover-art"
                src="./images/lyric-solitaire-coming-soon.png"
                alt="Lyric Solitaire — Coming Soon. Sing the Words You Love."
            >

            <!--
                When the game is ready, change display:none above
                and this link will take the player to game.html.
            -->

            <a
                class="play-button"
                href="./game.html"
            >
                Play Lyric Solitaire
            </a>

        </div>

    </main>

</body>

</html>
